<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Galaxy Q&A</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            color: #fff;
            font-family: 'Google Sans', 'SN Pro', Arial, sans-serif;
            min-height: 100vh;
            margin: 0;
            /* Ensure content is above the canvas */
            position: relative;
        }
        #space-bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }
        .login-container {
            max-width: 400px;
            margin: 28vh auto 0 auto;
            background: rgba(30, 34, 54, 0.97);
            border-radius: 18px;
            box-shadow: 0 4px 32px 0 #000a;
            padding: 2.5rem 2.5rem 2rem 2.5rem;
            position: relative;
            z-index: 2;
        }
        .login-container h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #e0e6f6;
            font-family: 'Google Sans', 'SN Pro', Arial, sans-serif;
        }
        .login-container label {
            display: block;
            margin-bottom: 0.5rem;
            color: #b0b8d1;
            font-family: 'Google Sans', 'SN Pro', Arial, sans-serif;
        }
        .login-container input {
            width: 100%;
            padding: 0.7rem;
            margin-bottom: 1.2rem;
            border-radius: 8px;
            border: none;
            background: #232946;
            color: #fff;
            font-size: 1rem;
            font-family: 'Google Sans', 'SN Pro', Arial, sans-serif;
        }
        .login-container button {
            width: 100%;
            background: #5c7aff;
            color: #fff;
            border: none;
            padding: 0.7rem 0;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.2s;
            font-family: 'Google Sans', 'SN Pro', Arial, sans-serif;
        }
        .login-container button:hover {
            background: #3b4cca;
        }
        .login-container .switch {
            text-align: center;
            margin-top: 1.2rem;
            color: #b0b8d1;
            font-family: 'Google Sans', 'SN Pro', Arial, sans-serif;
        }
        .login-container .switch a {
            color: #5c7aff;
            text-decoration: underline;
            cursor: pointer;
        }
        .login-error {
            color: #ff6b6b;
            text-align: center;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

<header>
        <div id="topnav">
                <img id="activepg" src="assets/hotbar logo.PNG">
                <button class="navbuttons" onclick="home()">Home</button>
                <button class="navbuttons" onclick="resource()">Resource Hub</button>
                <button class="navbuttons" onclick="highlights()">Highlights</button>
                <button class="navbuttons" onclick="window.location.href='posts.html'">Posts</button>
                <!-- clipPath for heart shape (kept hidden) -->
                <svg style="width:0;height:0;position:absolute" aria-hidden="true">
                    <defs>
                        <clipPath id="myPath" clipPathUnits="objectBoundingBox">
                            <path d="M0.373,0.967 S0.616,0.866,0.768,0.644 S0.912,0.107,0.739,0 S0.373,0.108,0.373,0.108 S0.166,-0.113,0,-0.002 S-0.159,0.432,-0.021,0.644 S0.373,0.967,0.373,0.967"></path>
                        </clipPath>
                    </defs>
                </svg>
                <!-- Heart (existing) placed between More and O to match requested position -->
                <div class="heart" role="button" tabindex="0" title="hold down!">
                    <div class="tank"></div>
                    <svg class="curve" viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
                        <defs>
                            <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
                        </defs>
                        <g>
                            <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(103, 130, 191, 0.5)" />
                            <use xlink:href="#gentle-wave" x="48" y="1" fill="rgba(103, 130, 191, 0.3)" />
                            <use xlink:href="#gentle-wave" x="48" y="2" fill="rgba(103, 130, 191, 1)" />
                        </g>
                    </svg>
                </div>
                <div class="dropdown">
                        <button id="moreBtn" class="navbuttons" aria-expanded="false" aria-controls="moreMenu">More ▾</button>
                        <div id="moreMenu" class="dropdown-menu" aria-hidden="true">
                                <button class="dropdown-item" onclick="window.location.href='faqs.html'">FAQs</button>
                                <button class="dropdown-item" onclick="window.location.href='refs.html'">References</button>
                                <button class="dropdown-item" id="loginDropdownBtn" onclick="window.location.href='login.html'">Login</button>
                        </div>
                </div>
        </div>
        <div id="compliment" class="compliment" aria-live="polite" aria-atomic="true"></div>
</header>

        <!-- Firebase Login/Logout Button Logic -->
        <script src="main.js"></script>
        <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
            import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
            const firebaseConfig = {
                apiKey: "AIzaSyCEjbKjo7bLbXsLm2FFS3nb5TjXNXMg2lc",
                authDomain: "mhig-edde5.firebaseapp.com",
                projectId: "mhig-edde5",
                storageBucket: "mhig-edde5.appspot.com",
                messagingSenderId: "855050639590",
                appId: "1:855050639590:web:84c985fb7c8e066681c327"
            };
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            window.addEventListener('DOMContentLoaded', function() {
                const loginBtn = document.getElementById('loginDropdownBtn');
                if (!loginBtn) return;
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        loginBtn.textContent = 'Log Out';
                        loginBtn.onclick = async function() {
                            await signOut(auth);
                            window.location.reload();
                        };
                    } else {
                        loginBtn.textContent = 'Login';
                        loginBtn.onclick = function() {
                            window.location.href = 'login.html';
                        };
                    }
                });
            });
        </script>

        <div class="login-container">
        <h2>Login to <br>Contribute to Our Posts!</h2>
        <h3 style="text-align:center;color:#b0b8d1;font-family:'Google Sans', 'SN Pro', Arial, sans-serif;margin-top:-0.5rem;margin-bottom:1.5rem; font-size: 0.85rem;
        ">Example Login: <br> Username: test123 <br> Password: testpass</h3>
        <div id="loginError" class="login-error" style="display:none;"></div>
        <form id="loginForm">
            <label for="username">Username</label>
            <input type="text" id="username" required placeholder="Enter your username">
            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="Enter your password">
            <button type="submit">Login</button>
        </form>
        <div class="switch">Don't have an account? <a id="showRegister">Sign Up!</a></div>
    </div>
    <div class="login-container" id="registerContainer" style="display:none;">
        <h2>Register to Contribute to Our Posts!</h2>
        <div id="registerError" class="login-error" style="display:none;"></div>
        <form id="registerForm">
            <label for="regUsername">Username</label>
            <input type="text" id="regUsername" required placeholder="Choose a username">
            <label for="regPassword">Password</label>
            <input type="password" id="regPassword" required placeholder="Create a password">
            <button type="submit">Sign Up</button>
        </form>
        <div class="switch">Already have an account? <a id="showLogin">Login</a></div>
    </div>
    <script type="module" src="login.js"></script>
    <script type="module">
        import { initSpaceBackground, triggerSun, triggerMoon } from './assets/space-bg.js';
        window.addEventListener('DOMContentLoaded', () => {
            initSpaceBackground();
            // Username and password input triggers
            const username = document.getElementById('username');
            const password = document.getElementById('password');
            if (username) {
                let sunTriggered = false;
                username.addEventListener('input', (e) => {
                    if (!sunTriggered && e.target.value.length === 1) {
                        triggerSun();
                        sunTriggered = true;
                    }
                    if (e.target.value.length === 0) {
                        sunTriggered = false;
                    }
                });
            }
            if (password) {
                let moonTriggered = false;
                password.addEventListener('input', (e) => {
                    if (!moonTriggered && e.target.value.length === 1) {
                        triggerMoon();
                        moonTriggered = true;
                    }
                    if (e.target.value.length === 0) {
                        moonTriggered = false;
                    }
                });
            }
            // Register form triggers
            const regUsername = document.getElementById('regUsername');
            const regPassword = document.getElementById('regPassword');
            if (regUsername) {
                let regSunTriggered = false;
                regUsername.addEventListener('input', (e) => {
                    if (!regSunTriggered && e.target.value.length === 1) {
                        triggerSun();
                        regSunTriggered = true;
                    }
                    if (e.target.value.length === 0) {
                        regSunTriggered = false;
                    }
                });
            }
            if (regPassword) {
                let regMoonTriggered = false;
                regPassword.addEventListener('input', (e) => {
                    if (!regMoonTriggered && e.target.value.length === 1) {
                        triggerMoon();
                        regMoonTriggered = true;
                    }
                    if (e.target.value.length === 0) {
                        regMoonTriggered = false;
                    }
                });
            }
        });
    </script>
</body>
</html>
