    <style>
        #galaxy-bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }
                #addPostBtn {
                    font-family: 'Google Sans', Arial, sans-serif !important;
                }
        .search-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 1.5rem 0 1rem 0;
        }
        #activeTagFilter {
            position: static;
            width: 200px;
            height: 65px;
            background: #232946;
            color: #fff;
            border-radius: 8px;
            padding: 0.4rem 1rem;
            text-align: center;
            z-index: 10;
            box-shadow: 0 2px 8px #0004;
            margin-left: 0.7rem;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
                        input, textarea, select {
                            font-family: 'Google Sans', Arial, sans-serif !important;
                        }
                .tags-input-container {
                        .tags-display {
                            display: flex;
                            flex-wrap: wrap;
                            gap: 0.3rem;
                            margin-bottom: 0.3rem;
                        }
                        .tag-bubble {
                            display: inline-block;
                            background: #5c7aff;
                            color: #fff;
                            border-radius: 12px;
                            padding: 0.2rem 0.8rem;
                            margin: 0.1rem 0.2rem 0.1rem 0;
                            font-size: 1em;
                            transition: background 0.15s, color 0.15s, outline 0.15s;
                            cursor: pointer;
                            position: relative;
                        }
                        .tag-bubble .remove-tag {
                            margin-left: 0.4em;
                            color: #fff;
                            font-weight: bold;
                            cursor: pointer;
                            font-size: 1.1em;
                            opacity: 0.7;
                            transition: opacity 0.15s;
                        }
                        .tag-bubble .remove-tag:hover {
                            opacity: 1;
                        }
                background: #232946;
                border-radius: 8px;
                padding: 0.5rem 0.7rem;
                position: relative;
                        #tagsAutocomplete.autofill {
                            position: absolute;
                            left: 0;
                            top: 0;
                            width: 100%;

                        }

        }
        .galaxy-header p {

            font-size: 1.1rem;
        }
        .search-container {
            display: flex;
            justify-content: center;
            margin: 1.5rem 0 1rem 0;
            /* Remove position: relative here */
        }
        .search-bar-wrapper {
            position: relative;
            display: inline-block;
        }
        .search-bar {
            width: 350px;
            padding: 0.7rem 1rem;
            border-radius: 25px 0 0 25px;
            border: none;
            outline: none;
            font-size: 1rem;
            background: #232946;
            color: #fff;
        }
        .search-btn {
            padding: 0.7rem 1.5rem;
            border-radius: 0 25px 25px 0;
            border: none;
            background: #5c7aff;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .search-btn:hover {
            background: #3b4cca;
        }
        .search-suggestions {

            position: absolute;
            top: 100%;
            left: 0;
            width: 350px;
            min-height: 2.2rem;
            background: #232946;
            border-radius: 0 0 16px 16px;
            box-shadow: 0 4px 16px #000a;
            z-index: 10;
            flex-wrap: wrap;
            gap: 0.3rem;
            margin-top: 0;
            padding: 0.5rem 0.5rem 0.2rem 0.5rem;
        }
        .search-tag-bubble {
            display: inline-block;
            background: #5c7aff;
            color: #fff;
            border-radius: 12px;
            padding: 0.2rem 0.8rem;
            margin: 0.2rem 0.3rem;
            cursor: pointer;

            color: #232946;
            outline: 2px solid #5c7aff;
        }
        .post-form {
            background: rgba(30, 34, 54, 0.98);
            border-radius: 16px;

            width: 95vw;

            box-shadow: 0 8px 40px 0 #000c;

            left: 50%;
            transform: translate(-50%, -50%);

            display: none;
        }
        .post-form.show {

        }
        .modal-overlay {

            top: 0;
            left: 0;
            width: 100vw;

            z-index: 2147483646;

        .post-form .close-btn {

            border: none;

            height: 36px;

            padding: 0;

            justify-content: center;

        }
        .post-form label {
            display: block;
            margin-bottom: 0.5rem;
            color: #b0b8d1;
        }
        .post-form input, .post-form textarea {
            width: 100%;
            padding: 0.7rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            border: none;
            background: #232946;
            color: #fff;
            font-size: 1rem;
            caret-color: #fff;
        }
        .post-form .tags-input {
            margin-bottom: 1rem;
        }
        .post-form button {
            background: #5c7aff;
            color: #fff;
            border: none;
            padding: 0.7rem 2rem;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .post-form button:hover {
            background: #3b4cca;
        }
        .posts-list {
            max-width: 800px;
            margin: 0 auto 2rem auto;
        }
        .post-card {
            background: rgba(30, 34, 54, 0.95);
            border-radius: 16px;
            margin-bottom: 1.5rem;
            padding: 1.5rem 2rem 1rem 2rem;
            box-shadow: 0 2px 16px 0 #0007;
            position: relative;
        }
        .post-title {
            font-size: 1.3rem;
            color: #e0e6f6;
            margin-bottom: 0.3rem;
        }
        .post-meta {
            color: #b0b8d1;
            font-size: 0.95rem;
            margin-bottom: 0.7rem;
        }
        .post-tags {
            margin-bottom: 0.7rem;
        }
        .post-tag {
            display: inline-block;
            background: #5c7aff;
            color: #fff;
            border-radius: 12px;
            padding: 0.2rem 0.8rem;
            font-size: 0.9rem;
            margin-right: 0.4rem;
            margin-bottom: 0.2rem;
        }
        .post-body {
            color: #e0e6f6;
            margin-bottom: 1rem;
        }
        .comments-section {
            margin-top: 1.2rem;
            padding-top: 1rem;
            border-top: 1px solid #2c314a;
        }
        .comment {
            background: #232946;
            border-radius: 8px;
            padding: 0.7rem 1rem;
            margin-bottom: 0.7rem;
            color: #fff;
        }
        .comment-meta {
            color: #b0b8d1;
            font-size: 0.85rem;
            margin-bottom: 0.2rem;
        }
        .comment-form {
            margin-top: 0.7rem;
            display: flex;
            gap: 0.5rem;

        .comment-form input {
            flex: 1;

        .comment-form button {

            border-radius: 8px;

    </style>

</head>

        <div class="search-container">
            <button id="addPostBtn" style="display:none;margin-right:1rem;background:#5c7aff;color:#fff;border:none;padding:0.7rem 1.5rem;border-radius:8px;font-size:1rem;cursor:pointer;transition:background 0.2s;height:55px;">Add a Post</button>
            <div class="search-bar-wrapper" style="position:relative;display:inline-block;">
                <input type="text" id="searchBar" class="search-bar" placeholder="Search questions or tags...">
                <div id="searchTagSuggestions" class="search-suggestions"></div>
            </div>
            <button class="search-btn" id="searchBtn">Search</button>
            <div id="activeTagFilter">
                <!-- Tag filter section is always present. Content will be updated by JS. -->
            </div>
        </div>
        <!-- post-form moved to modal above -->
        <div id="loginPrompt" style="display:none;text-align:center;margin:2rem 0;color:#b0b8d1;font-size:1.1rem;">

        </div>

    <div class="posts-list" id="postsList"></div>
<script type="module" src="posts.js"></script>
<script>
// Popup modal logic for post form
document.addEventListener('DOMContentLoaded', function() {
    const addPostBtn = document.getElementById('addPostBtn');
    const postForm = document.getElementById('postForm');
    const overlay = document.getElementById('postModalOverlay');
    const closeBtn = document.getElementById('closePostForm');
    function showModal() {
        postForm.classList.add('show');
        overlay.classList.add('show');
    }
    function hideModal() {
        postForm.classList.remove('show');
        overlay.classList.remove('show');
        postForm.reset();
        if (window.selectedTags) { window.selectedTags = []; }
        if (window.updateTagsDisplay) { window.updateTagsDisplay(); }
    }
    if (addPostBtn) {
        addPostBtn.addEventListener('click', showModal);
    }
    if (closeBtn) {
        closeBtn.addEventListener('click', hideModal);
    }
    if (overlay) {
        overlay.addEventListener('click', hideModal);
    }
    // Prevent form submit from closing modal on error
    postForm.addEventListener('submit', function(e) {
        if (!postForm.checkValidity()) {
            e.preventDefault();
        } else {
            hideModal();
        }
    });
});
</script>
</body>
